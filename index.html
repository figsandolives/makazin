<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FB">
  <title>رصيد | Raseed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply saved prefs before first paint to avoid a flash
    try {
      var p = JSON.parse(localStorage.getItem('raseed.prefs.v2') || '{}');
      var h = document.documentElement;
      if (p.lang === 'en') { h.lang = 'en'; h.dir = 'ltr'; }
      if (p.theme) h.dataset.theme = p.theme;
      if (p.collapsed) h.classList.add('sb-collapsed');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="sb-backdrop" id="sbBackdrop"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-wrap" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></section>
  </div>

  <div class="cmdk-wrap" id="cmdk" aria-hidden="true">
    <div class="cmdk-backdrop" data-close></div>
    <div class="cmdk" role="dialog" aria-modal="true"></div>
  </div>

  <div class="confirm-wrap" id="confirm"></div>
  <div class="login-wrap" id="login"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div id="printArea"></div>

  <script src="js/figs-rtdb.js"></script>
  <script>if (/[?&]mock\b/.test(location.search)) document.write('<script src="js/mock-db.js"><\/script>');</script>
  <script src="js/live.js"></script>
  <script src="js/local-copy.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/sales-stock.js"></script>
  <script src="js/purchasing.js"></script>
  <script src="js/supplier-returns.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/sticker.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/devices.js"></script>
  <script src="js/users.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/branches.js"></script>
  <script src="js/delivery-fees.js"></script>
  <script src="js/discounts.js"></script>
  <script src="js/name-lists.js"></script>
  <script src="js/daily-sessions.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/batches.js"></script>
  <script src="js/locations.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/inventory-more.js"></script>
  <script src="js/production-tracking.js"></script>
  <script src="js/item-card.js"></script>
  <script src="js/combobox.js"></script>
  <script src="js/stock-alarm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
